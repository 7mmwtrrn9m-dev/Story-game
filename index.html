<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131e">
<title>Два берега — история Саши и Ани</title>
<style>
:root{color-scheme:dark;--ink:#f4ead8;--muted:#b7b0aa;--gold:#e7bd77;--panel:rgba(14,17,27,.94)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e16;color:var(--ink);font-family:Georgia,'Times New Roman',serif;touch-action:none}
#game{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#202638 0,#0b0e16 72%)}
#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;background:#101522;box-shadow:0 20px 90px #000b;border:1px solid #ffffff18}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none}
#chapter{position:absolute;left:3.1%;top:4%;font:11px/1.3 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#f2d6a4;text-shadow:0 2px 5px #000;opacity:.92}
#hint{position:absolute;right:3%;top:4%;font:11px Arial,sans-serif;color:#eee0c7;text-shadow:0 2px 5px #000;text-align:right}
#dialogue{position:absolute;left:5%;right:5%;bottom:4.5%;min-height:25%;padding:2.1% 2.5% 1.7%;background:linear-gradient(135deg,rgba(15,19,30,.97),rgba(27,29,39,.94));border:1px solid #d6b77c88;box-shadow:0 8px 30px #0009;pointer-events:auto;display:none}
#speaker{font:700 clamp(10px,1.3vw,16px) Arial,sans-serif;color:#edc98e;letter-spacing:.08em;margin-bottom:.8%}
#text{font-size:clamp(12px,1.65vw,20px);line-height:1.42;white-space:pre-wrap;max-width:100%;color:#f4eee4}
#continue{position:absolute;right:2%;bottom:9%;font:10px Arial,sans-serif;color:#d9bd8e;letter-spacing:.12em;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
#choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.4%;pointer-events:auto}
.choice{border:1px solid #c9a56d;background:#252536;color:#f7e8ce;padding:8px 13px;font:12px Arial,sans-serif;cursor:pointer}.choice:hover,.choice:focus{background:#564333;outline:none}
#mobile{position:absolute;inset:auto 0 0 0;height:35%;display:none;pointer-events:none}
.pad{position:absolute;left:3%;bottom:7%;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:3px;pointer-events:auto}
.pad button,.action{border:1px solid #ffffff45;background:#11182799;color:#fff;border-radius:8px;font:18px Arial,sans-serif;backdrop-filter:blur(4px);touch-action:none}
.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
.action{position:absolute;right:4%;bottom:12%;width:62px;height:62px;border-radius:50%;font:700 12px Arial,sans-serif;color:#f4d5a1;pointer-events:auto}
#start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#0d1320aa,#0b0e16e8);pointer-events:auto}
.start-card{width:min(72%,540px);text-align:center;padding:5% 4%;background:#111827e8;border:1px solid #d8b77c77;box-shadow:0 15px 50px #0009}
.start-card h1{font-size:clamp(28px,5vw,58px);font-weight:400;letter-spacing:.08em;margin:0 0 7px;color:#f2d5a3}
.start-card .sub{font:11px Arial,sans-serif;letter-spacing:.25em;color:#c3b6a3;text-transform:uppercase;margin-bottom:22px}
.start-card p{font-size:clamp(13px,1.5vw,17px);line-height:1.5;color:#e0d8cc;margin:0 auto 22px;max-width:420px}
#startBtn{border:1px solid #e1bd80;background:#47382d;color:#fff1d7;padding:12px 26px;font:12px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
#startBtn:hover{background:#725338}
#saveNote{font:10px Arial,sans-serif;color:#8f918f;margin-top:14px}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);background:#101827e8;border:1px solid #c8a875;padding:8px 14px;font:11px Arial,sans-serif;color:#f1dfbf;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
@media (pointer:coarse),(max-width:700px){#mobile{display:block}#hint{top:8%;font-size:9px}#chapter{font-size:9px}#dialogue{bottom:3%;min-height:30%;padding:3%}#text{font-size:clamp(12px,3vw,17px)}.start-card{width:88%;padding:8% 5%}}
</style>
</head>
<body>
<div id="game"><div id="frame">
<canvas id="screen" width="480" height="270" aria-label="Игра Два берега"></canvas>
<div id="hud">
<div id="chapter"></div><div id="hint"></div><div id="toast"></div>
<div id="dialogue">
<div id="speaker"></div><div id="text"></div><div id="choices"></div>

<div id="mobile">
<div class="pad">
<button data-move="up">▲</button>
<button data-move="left">◀</button>
<button data-move="down">▼</button>

</div>
<button class="action" id="action">ДЕЙСТВИЕ</button>
</div>
<div id="start">
<div class="start-card">
<h1>Два берега</h1>
<div class="sub">История Саши и Ани</div>
<p>Два человека. Два окна в вечернем Петербурге. И история, которая начинается с обычного сообщения.</p>
<button id="startBtn">Начать историю</button>
<div id="saveNote">Автосохранение включено · Можно играть на телефоне и компьютере</div>
</div>
</div>
</div></div></div>

<script>
(()=>{'use strict';

const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d',{alpha:false});

const chapterEl=document.getElementById('chapter');

const SAVE_KEY='dva_berega_save_v1';

const chapters=[

ending:{chapter:7,kind:'ending',title:'Начало',spawn:[240,220],objects:[]}
};

let state={
scene:'intro',x:240,y:220,face:1,dialogue:null,line:0,
locked:false,done:{},flags:{},lastTime:0,toastTimer:0,started:false
};

let keys={};
let touchMove={x:0,y:0};
let near=null;
let walkTick=0;

function save(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify({
scene:state.scene,x:state.x,y:state.y,
done:state.done,flags:state.flags,started:state.started
}));
}catch(e){}
}

function load(){
try{
const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
if(s&&scenes[s.scene]){
state.scene=s.scene;
state.x=Number.isFinite(s.x)?s.x:scenes[s.scene].spawn[0];
state.y=Number.isFinite(s.y)?s.y:scenes[s.scene].spawn[1];
state.done=s.done||{};
state.flags=s.flags||{};
state.started=!!s.started;
return true;
}
}catch(e){}
return false;
}

function toast(t){
toastEl.textContent=t;
toastEl.style.opacity='1';
state.toastTimer=2.2;
}

function rect(x,y,w,h,c){
ctx.fillStyle=c;
ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function line(x1,y1,x2,y2,c,w=1){
ctx.strokeStyle=c;
ctx.lineWidth=w;
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
}

function pixelText(t,x,y,size=8,color='#e8dfd0',align='left'){
ctx.fillStyle=color;
ctx.font=`${size}px monospace`;
ctx.textAlign=align;
ctx.fillText(t,x,y);
ctx.textAlign='left';
}

function noise(seed=1,count=300){
let n=seed;
for(let i=0;i<count;i++){
n=(n*1664525+1013904223)>>>0;
const x=n%W;
n=(n*1664525+1013904223)>>>0;
const y=n%H;
const a=.035+((n>>>8)%5)*.012;
ctx.fillStyle=`rgba(255,235,195,${a})`;
ctx.fillRect(x,y,1,1);
}
}

function vignette(){
const g=ctx.createRadialGradient(240,130,45,240,130,300);
g.addColorStop(0,'rgba(0,0,0,0)');
g.addColorStop(1,'rgba(0,0,0,.52)');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);
}

rect(x-3,y-3,w+6,h+6,'#171c28');

rect(x+w/2-1,y,2,h,'#3a4050');
rect(x,y+h/2-1,w,2,'#3a4050');
}

function drawRain(){
for(let i=0;i<36;i++){
const x=(i*47+Math.floor(performance.now()/90)*3)%W;
const y=(i*29+Math.floor(performance.now()/65)*5)%H;
line(x,y,x-2,y+6,'#9eafc155',1);
}
}

function drawScene(){
ctx.clearRect(0,0,W,H);
const s=scenes[state.scene];
if(!s)return;

switch(s.kind){
case'split':drawIntro();break;
case'chat':drawChat();break;
case'pub':
drawPub();
drawPerson(state.x,state.y,'sasha',1,Math.floor(walkTick)%2);
break;
case'street':
drawStreet();
if(state.scene==='flowers'&&state.flags.haveFlowers){
rect(74,199,7,15,'#4c8b65');
rect(69,194,17,7,'#e5b9c1');
}
drawPerson(state.x,state.y,'sasha',1,Math.floor(walkTick)%2);
break;
case'home':drawHome();break;
case'montage':drawMontage();break;
case'cottage':drawCottage();break;
case'bath':drawBathroom();break;
case'ending':drawEnding();break;
}

if(state.scene!=='intro'&&state.scene!=='chat'&&state.scene!=='montage'&&state.scene!=='ending'){
near=findNear();
if(near&&!state.dialogue){
pixelText('E  '+near.label.toUpperCase(),Math.min(near.x,390),Math.max(20,near.y-48),7,'#f5d9a8');
}
}

if(state.scene==='intro'){
pixelText('ДВА ЧЕЛОВЕКА · ДВА ОКНА',240,244,8,'#e9d4b0','center');
}
if(state.scene==='chat'){
pixelText('НАЖМИ E, ЧТОБЫ ПРОДОЛЖИТЬ',240,16,7,'#e9d4b0','center');
}

noise(13,130);
vignette();

chapterEl.textContent=chapters[s.chapter]||'';
hintEl.textContent=(state.scene==='intro'||state.scene==='chat'||state.scene==='montage'||state.scene==='ending')
?'ПРОБЕЛ / E — ДАЛЬШЕ'
:'WASD / СТРЕЛКИ — ДВИЖЕНИЕ · E — ДЕЙСТВИЕ';
}

function findNear(){
const s=scenes[state.scene];
let best=null,dist=999;

for(const o of s.objects||[]){
const d=Math.hypot(state.x-o.x,state.y-o.y);
if(d<dist&&d<54){best=o;dist=d;}
}
return best;
}

function say(speaker,text,after=null){
state.dialogue={speaker,text,after};
state.locked=true;
speakerEl.textContent=speaker;
textEl.textContent=text;
choicesEl.innerHTML='';
dialogueEl.style.display='block';
}

function closeDialogue(){
if(!state.dialogue)return;
const after=state.dialogue.after;
state.dialogue=null;
state.locked=false;
dialogueEl.style.display='none';
if(after)after();
save();
}

function choiceDialog(speaker,text,options){
state.dialogue={speaker,text,after:null};
state.locked=true;
speakerEl.textContent=speaker;
textEl.textContent=text;
choicesEl.innerHTML='';

options.forEach(o=>{
const b=document.createElement('button');
b.className='choice';
b.textContent=o.label;
b.addEventListener('click',()=>{
choicesEl.innerHTML='';
state.dialogue=null;
state.locked=false;
dialogueEl.style.display='none';
o.run();
save();
});
choicesEl.appendChild(b);
});

dialogueEl.style.display='block';
}

function go(scene){
state.scene=scene;
state.x=scenes[scene].spawn[0];
state.y=scenes[scene].spawn[1];
state.dialogue=null;
state.locked=false;
dialogueEl.style.display='none';
save();
}

function move(dt){
if(state.locked||state.scene==='intro'||state.scene==='chat'||state.scene==='montage'||state.scene==='ending')return;

let dx=0,dy=0;

if(keys.ArrowLeft||keys.KeyA||touchMove.x<0)dx=-1;
if(keys.ArrowRight||keys.KeyD||touchMove.x>0)dx=1;
if(keys.ArrowUp||keys.KeyW||touchMove.y<0)dy=-1;
if(keys.ArrowDown||keys.KeyS||touchMove.y>0)dy=1;

if(dx||dy){
const l=Math.hypot(dx,dy);
dx/=l;dy/=l;
state.x=Math.max(16,Math.min(464,state.x+dx*82*dt));
state.y=Math.max(120,Math.min(244,state.y+dy*82*dt));
state.face=dx<0?-1:1;
walkTick+=dt*8;
}
}

function loop(t){
const dt=Math.min(.04,(t-state.lastTime)/1000||0);
state.lastTime=t;
move(dt);

if(state.toastTimer>0){
state.toastTimer-=dt;
if(state.toastTimer<=0)toastEl.style.opacity='0';
}

drawScene();
requestAnimationFrame(loop);
}

function start(){
startEl.style.display='none';
state.started=true;
if(!load()){
state.scene='intro';
state.x=240;
state.y=220;
}
save();
toast('История началась');
}

document.getElementById('startBtn').addEventListener('click',start);

window.addEventListener('keydown',e=>{
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
keys[e.code]=true;
if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){
if(!state.started)return;
interact();
}
});

window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{
keys={};
touchMove={x:0,y:0};
});

document.querySelectorAll('[data-move]').forEach(b=>{
const dir=b.dataset.move;
const set=(v)=>{
if(dir==='left')touchMove.x=v?-1:0;
if(dir==='right')touchMove.x=v?1:0;
if(dir==='up')touchMove.y=v?-1:0;
if(dir==='down')touchMove.y=v?1:0;
};
b.addEventListener('pointerdown',e=>{
e.preventDefault();
b.setPointerCapture(e.pointerId);
set(true);
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
b.addEventListener(ev,()=>set(false));
});
});

document.getElementById('action').addEventListener('pointerdown',e=>{
e.preventDefault();
interact();
});

canvas.addEventListener('pointerdown',()=>{
if(state.dialogue)closeDialogue();
else if(state.scene==='intro'||state.scene==='chat'||state.scene==='montage'||state.scene==='ending')interact();
});

dialogueEl.addEventListener('pointerdown',e=>{
if(e.target.classList.contains('choice'))return;
if(state.dialogue&&choicesEl.children.length===0)closeDialogue();
});

if(load()){
document.getElementById('saveNote').textContent='Найдено сохранение · Нажми «Начать историю», чтобы продолжить';
}

requestAnimationFrame(loop);
})();
