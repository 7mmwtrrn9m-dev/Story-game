<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#11131b">
  <title>Наша история</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="game-name">НАША ИСТОРИЯ</div>
      <div id="chapter-name">Глава 1</div>
    </header>

    <section id="game-container">
      <div id="game"></div>

      <div class="mobile-controls">
        <div class="dpad">
          <button data-dir="up" aria-label="Вверх">▲</button>
          <div class="dpad-middle">
            <button data-dir="left" aria-label="Влево">◀</button>
            <button data-dir="down" aria-label="Вниз">▼</button>
            <button data-dir="right" aria-label="Вправо">▶</button>
          </div>
        </div>
        <button id="action-button">ДЕЙСТВИЕ</button>
      </div>
    </section>

    <footer>
      <span>WASD / стрелки — движение</span>
      <span>E / ПРОБЕЛ — взаимодействие</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
